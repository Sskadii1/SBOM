version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sbom-pipeline-app
    depends_on:
      - neo4j
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD} 
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - NVD_API_KEYS=${NVD_API_KEYS}
    volumes:
      - ./:/app
    working_dir: /app
    networks:
      - sbom_network

  neo4j:
    image: neo4j:latest
    container_name: neo4j-knowledge-graph
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - sbom_network

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  sbom_network:
    driver: bridge
