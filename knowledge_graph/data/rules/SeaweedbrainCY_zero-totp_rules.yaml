  languages: &id001
  - python
  metadata:
    vuln_id: CVE-2026-24049
    package: wheel
    tier: direct
    sink_quality: generic
    confidence: '0.9'
    sink_function: unpack
  pattern-either:
  - patterns:
    - pattern: unpack(...)
