  severity: WARNING
  languages: &id001
  - python
  metadata:
    vuln_id: CVE-2026-25645
    package: requests
    tier: direct
    sink_quality: strong
    confidence: '0.9'
    sink_function: extract_zipped_paths
  pattern-either:
  - patterns:
    - pattern: extract_zipped_paths(...)
    - pattern-inside: |-
        from requests import extract_zipped_paths
        ...
  - patterns:
    - pattern: extract_zipped_paths(...)
