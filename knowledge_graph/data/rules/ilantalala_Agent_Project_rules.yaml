rules:
- id: sbom-reach-cve_2026_24049-unpack-direct
  message: 'CVE-2026-24049: vulnerable sink ''unpack'' directly called - package wheel'
  severity: WARNING
  languages: &id001
  - python
  metadata:
    vuln_id: CVE-2026-24049
    package: wheel
    tier: direct
    sink_quality: generic
    confidence: '0.9'
    sink_function: unpack
  pattern-either:
  - patterns:
    - pattern: unpack(...)
    - pattern-inside: |-
        from wheel import unpack
        ...
  - patterns:
    - pattern: unpack(...)
    - pattern-regex: (?ms)^\s*from\s+wheel(?:\.[A-Za-z_]\w*)*\s+import\s*(?:\(|\\)?[\s\S]*?\bunpack\b
  - patterns:
    - pattern: wheel.unpack(...)
    - pattern-inside: |-
        import wheel
        ...
  - patterns:
    - pattern: wheel.unpack(...)
    - pattern-regex: (?m)^\s*import\s+wheel\b(?:\s+as\s+[A-Za-z_]\w*)?
- id: sbom-reach-cve_2026_24049-unpack-import
  message: 'CVE-2026-24049: vulnerable package ''wheel'' imported but code paths may vary'
