  severity: WARNING
  languages: &id001
  - python
  metadata:
    vuln_id: CVE-2023-32681
    package: requests
    tier: direct
    sink_quality: strong
    confidence: '0.9'
    sink_function: rebuild_proxies
  pattern-either:
  - patterns:
    - pattern: rebuild_proxies(...)
    - pattern-inside: |-
        from requests import rebuild_proxies
        ...
  - patterns:
    - pattern: rebuild_proxies(...)
    - pattern-regex: (?ms)^\s*from\s+requests(?:\.[A-Za-z_]\w*)*\s+import\s*(?:\(|\\)?[\s\S]*?\brebuild_proxies\b
  - patterns:
    - pattern: requests.rebuild_proxies(...)
