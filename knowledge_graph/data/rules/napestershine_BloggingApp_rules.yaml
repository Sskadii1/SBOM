- id: sbom-reach-cve_2026_25645-extract_zipped_paths-direct
  message: 'CVE-2026-25645: vulnerable sink ''extract_zipped_paths'' directly called - package requests'
  severity: WARNING
  languages: &id001
  - python
  metadata:
    vuln_id: CVE-2026-25645
    package: requests
    tier: direct
    sink_quality: strong
    confidence: '0.9'
    sink_function: extract_zipped_paths
  pattern-either:
  - patterns:
    - pattern: extract_zipped_paths(...)
    - pattern-inside: |-
        from requests import extract_zipped_paths
        ...
  - patterns:
    - pattern: extract_zipped_paths(...)
    - pattern-regex: (?ms)^\s*from\s+requests(?:\.[A-Za-z_]\w*)*\s+import\s*(?:\(|\\)?[\s\S]*?\bextract_zipped_paths\b
  - patterns:
    - pattern: requests.extract_zipped_paths(...)
    - pattern-inside: |-
        import requests
        ...
  - patterns:
    - pattern: requests.extract_zipped_paths(...)
    - pattern-regex: (?m)^\s*import\s+requests\b(?:\s+as\s+[A-Za-z_]\w*)?
  - pattern: extract_zipped_paths(...)
