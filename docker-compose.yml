# ============================================================
# SBOM Security Dashboard - Docker Compose
#
# Local development/research only. Do not expose Streamlit or Neo4j directly
# to the Internet without authentication, TLS, and network restrictions.
#
# Usage:
#   1. Copy .env.example to .env and fill in local values.
#   2. Run: docker compose up --build
# ============================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sbom-app
    ports:
      - "${APP_HOST_PORT:-8501}:8501"
    environment:
      - NEO4J_URI=${NEO4J_URI:-bolt://host.docker.internal:7688}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-change_me}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - USER_REPO_CLONE_DIR=${USER_REPO_CLONE_DIR:-/app/knowledge_graph/data/user_repos}
      - ALLOW_UNTRUSTED_DEPENDENCY_INSTALL=${ALLOW_UNTRUSTED_DEPENDENCY_INSTALL:-false}
      - LLM_PROVIDER=${LLM_PROVIDER:-anthropic}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - claude_api_key=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://api.anthropic.com/v1/messages}
      - ANTHROPIC_VERSION=${ANTHROPIC_VERSION:-2023-06-01}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-claude-sonnet-4-6}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.1}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - NVD_API_KEYS=${NVD_API_KEYS:-}
      - VULNCHECK_API_KEY=${VULNCHECK_API_KEY:-}
    volumes:
      - ./knowledge_graph/data:/app/knowledge_graph/data
    networks:
      - sbom_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  sbom_network:
    driver: bridge
