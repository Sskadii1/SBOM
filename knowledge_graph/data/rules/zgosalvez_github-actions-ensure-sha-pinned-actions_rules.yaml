          ...
      - pattern-inside: |-
          import $MOD from 'undici';
          ...
      - pattern-inside: |-
          import * as $MOD from 'undici';
          ...
      - pattern-inside: |-
          $MOD = await import('undici')
          ...
      - pattern-inside: |-
          $MOD = (await import('undici')).default
          ...
      - pattern-inside: |-
          const $MOD = require("undici");
          ...
